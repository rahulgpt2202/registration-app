apiVersion: apps/v1
kind: Deployment
metadata:
  name: regapp-deployment
  namespace: default
  labels:
    app: regapp
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app: regapp
  template:
    metadata:
      labels:
        app: regapp
    spec:
      containers:
      - name: regapp
        image: ashfaque9x/regapp
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
